<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restoran Karbit Champions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .header {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
            text-align: center;
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="2" fill="rgba(255,255,255,0.1)"/></svg>') repeat;
            animation: float 20s linear infinite;
        }

        @keyframes float {
            0% { transform: translateX(-50%) translateY(-50%) rotate(0deg); }
            100% { transform: translateX(-50%) translateY(-50%) rotate(360deg); }
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }

        .content {
            padding: 40px;
        }

        .welcome-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .welcome-section input {
            width: 100%;
            max-width: 400px;
            padding: 15px 20px;
            border: 2px solid #ddd;
            border-radius: 50px;
            font-size: 1.1em;
            text-align: center;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
        }

        .welcome-section input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
            transform: translateY(-2px);
        }

        .menu-section {
            margin: 30px 0;
        }

        .menu-title {
            text-align: center;
            font-size: 2em;
            color: #333;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .menu-item {
            background: linear-gradient(135deg, #fff 0%, #f8f9fa 100%);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border: 2px solid transparent;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .menu-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.5s;
        }

        .menu-item:hover::before {
            left: 100%;
        }

        .menu-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            border-color: #667eea;
        }

        .menu-item.selected {
            border-color: #ff6b6b;
            background: linear-gradient(135deg, #fff5f5 0%, #ffe8e8 100%);
        }

        .menu-item h3 {
            color: #333;
            font-size: 1.4em;
            margin-bottom: 10px;
        }

        .menu-item .price {
            color: #ff6b6b;
            font-size: 1.3em;
            font-weight: bold;
        }

        .menu-item .quantity {
            position: absolute;
            top: 10px;
            right: 15px;
            background: #ff6b6b;
            color: white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transform: scale(0);
            transition: transform 0.3s ease;
        }

        .menu-item.selected .quantity {
            transform: scale(1);
        }

        .order-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 15px;
            padding: 25px;
            margin: 20px 0;
            border: 2px solid #dee2e6;
        }

        .order-title {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 15px;
            text-align: center;
        }

        .order-list {
            margin-bottom: 20px;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #dee2e6;
        }

        .order-item:last-child {
            border-bottom: none;
            font-weight: bold;
            font-size: 1.2em;
            color: #ff6b6b;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transition: all 0.3s ease;
            transform: translate(-50%, -50%);
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #56ab2f 0%, #a8e6cf 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(86, 171, 47, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 65, 108, 0.4);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            animation: modalSlideIn 0.3s ease;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hidden {
            display: none;
        }

        .success-message {
            background: linear-gradient(135deg, #56ab2f 0%, #a8e6cf 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin: 20px 0;
            font-size: 1.2em;
            animation: successPulse 2s ease-in-out;
        }

        @keyframes successPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }
            
            .content {
                padding: 20px;
            }
            
            .menu-grid {
                grid-template-columns: 1fr;
            }
            
            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍽️ RESTORAN AMBA CHAMPIONS</h1>
            <p>Rasakan Kelezatan Terbaik di Ngawi!</p>
        </div>
        
        <div class="content">
            <div class="welcome-section">
                <h2 style="margin-bottom: 20px; color: #333;">Selamat Datang!</h2>
                <input type="text" id="customerName" placeholder="Dengan tuan/nyonya siapa?" required>
            </div>

            <div class="menu-section">
                <h2 class="menu-title">🍖 DAFTAR MENU 🍖</h2>
                <div class="menu-grid">
                    <div class="menu-item" data-id="1" data-name="Daging rendang" data-price="50000">
                        <h3>🥩 Daging Rendang</h3>
                        <p class="price">Rp. 50.000</p>
                        <div class="quantity">0</div>
                    </div>
                    <div class="menu-item" data-id="2" data-name="Daging rusdi" data-price="1500000">
                        <h3>🥩 Daging Rusdi</h3>
                        <p class="price">Rp. 1.500.000</p>
                        <div class="quantity">0</div>
                    </div>
                    <div class="menu-item" data-id="3" data-name="Paha amba" data-price="500000">
                        <h3>🍗 Paha Amba</h3>
                        <p class="price">Rp. 500.000</p>
                        <div class="quantity">0</div>
                    </div>
                    <div class="menu-item" data-id="4" data-name="Susu tringgiling" data-price="1000">
                        <h3>🥛 Susu Tringgiling</h3>
                        <p class="price">Rp. 1.000</p>
                        <div class="quantity">0</div>
                    </div>
                </div>
            </div>

            <div class="order-section hidden" id="orderSection">
                <h3 class="order-title">📋 Ringkasan Pesanan</h3>
                <div class="order-list" id="orderList"></div>
                
                <div class="buttons">
                    <button class="btn btn-primary" onclick="resetOrder()">🔄 Reset Pesanan</button>
                    <button class="btn btn-success" onclick="confirmOrder()">✅ Konfirmasi Pesanan</button>
                </div>
            </div>

            <div class="buttons" style="margin-top: 30px;">
                <button class="btn btn-primary" onclick="showOrder()">👀 Lihat Pesanan</button>
            </div>
        </div>
    </div>

    <!-- Modal Konfirmasi -->
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <h2 style="margin-bottom: 20px; color: #333;">🛒 Konfirmasi Pesanan</h2>
            <div id="confirmDetails"></div>
            <div class="buttons" style="margin-top: 20px;">
                <button class="btn btn-danger" onclick="closeModal()">❌ Batal</button>
                <button class="btn btn-success" onclick="finalConfirm()">✅ Ya, Benar</button>
            </div>
        </div>
    </div>

    <script>
        let orders = {};
        let customerName = '';

        // Format currency
        function formatCurrency(amount) {
            return 'Rp. ' + amount.toLocaleString('id-ID');
        }

        // Add click event to menu items
        document.querySelectorAll('.menu-item').forEach(item => {
            item.addEventListener('click', function() {
                const name = document.getElementById('customerName').value.trim();
                if (!name) {
                    alert('Mohon masukkan nama Anda terlebih dahulu!');
                    document.getElementById('customerName').focus();
                    return;
                }
                
                customerName = name;
                const id = this.dataset.id;
                const itemName = this.dataset.name;
                const price = parseInt(this.dataset.price);
                
                // Add to order
                if (orders[id]) {
                    orders[id].quantity += 1;
                } else {
                    orders[id] = {
                        name: itemName,
                        price: price,
                        quantity: 1
                    };
                }
                
                updateMenuDisplay();
                updateOrderDisplay();
            });
        });

        // Update menu display with quantities
        function updateMenuDisplay() {
            document.querySelectorAll('.menu-item').forEach(item => {
                const id = item.dataset.id;
                const quantityEl = item.querySelector('.quantity');
                
                if (orders[id] && orders[id].quantity > 0) {
                    item.classList.add('selected');
                    quantityEl.textContent = orders[id].quantity;
                } else {
                    item.classList.remove('selected');
                    quantityEl.textContent = '0';
                }
            });
        }

        // Update order display
        function updateOrderDisplay() {
            const orderList = document.getElementById('orderList');
            const orderSection = document.getElementById('orderSection');
            
            if (Object.keys(orders).length === 0) {
                orderSection.classList.add('hidden');
                return;
            }
            
            orderSection.classList.remove('hidden');
            
            let html = '';
            let total = 0;
            
            for (const [id, order] of Object.entries(orders)) {
                const subtotal = order.price * order.quantity;
                total += subtotal;
                
                html += `
                    <div class="order-item">
                        <span>${order.name} x${order.quantity}</span>
                        <span>${formatCurrency(subtotal)}</span>
                    </div>
                `;
            }
            
            html += `
                <div class="order-item">
                    <span><strong>TOTAL HARGA</strong></span>
                    <span><strong>${formatCurrency(total)}</strong></span>
                </div>
            `;
            
            orderList.innerHTML = html;
        }

        // Show order section
        function showOrder() {
            const name = document.getElementById('customerName').value.trim();
            if (!name) {
                alert('Mohon masukkan nama Anda terlebih dahulu!');
                document.getElementById('customerName').focus();
                return;
            }
            
            if (Object.keys(orders).length === 0) {
                alert('Belum ada pesanan! Silakan pilih menu terlebih dahulu.');
                return;
            }
            
            customerName = name;
            document.getElementById('orderSection').scrollIntoView({ behavior: 'smooth' });
        }

        // Reset order
        function resetOrder() {
            if (confirm('Yakin ingin menghapus semua pesanan?')) {
                orders = {};
                updateMenuDisplay();
                updateOrderDisplay();
            }
        }

        // Show confirmation modal
        function confirmOrder() {
            if (Object.keys(orders).length === 0) {
                alert('Belum ada pesanan!');
                return;
            }
            
            let html = `
                <div style="text-align: left; margin: 20px 0;">
                    <p><strong>Nama Pelanggan:</strong> ${customerName}</p>
                    <br>
                    <p><strong>Detail Pesanan:</strong></p>
            `;
            
            let total = 0;
            for (const [id, order] of Object.entries(orders)) {
                const subtotal = order.price * order.quantity;
                total += subtotal;
                html += `<p>• ${order.name} x${order.quantity} = ${formatCurrency(subtotal)}</p>`;
            }
            
            html += `
                    <br>
                    <p><strong>Total Pembayaran: ${formatCurrency(total)}</strong></p>
                </div>
            `;
            
            document.getElementById('confirmDetails').innerHTML = html;
            document.getElementById('confirmModal').style.display = 'block';
        }

        // Final confirmation
        function finalConfirm() {
            closeModal();
            
            // Show success message
            const content = document.querySelector('.content');
            const successDiv = document.createElement('div');
            successDiv.className = 'success-message';
            
            let total = 0;
            let orderDetails = '';
            for (const [id, order] of Object.entries(orders)) {
                const subtotal = order.price * order.quantity;
                total += subtotal;
                orderDetails += `<p>• ${order.name} x${order.quantity} = ${formatCurrency(subtotal)}</p>`;
            }
            
            successDiv.innerHTML = `
                <h2>PESANAN DIKONFIRMASI!</h2>
                <p><strong>Terima kasih ${customerName}!</strong></p>
                <div style="margin: 15px 0; text-align: left;">
                    ${orderDetails}
                    <p><strong>Total: ${formatCurrency(total)}</strong></p>
                </div>
                <p>🍽️ Pesanan Anda akan segera siap!</p>
            `;
            
            content.appendChild(successDiv);
            
            // Reset after success
            setTimeout(() => {
                orders = {};
                customerName = '';
                document.getElementById('customerName').value = '';
                updateMenuDisplay();
                updateOrderDisplay();
                successDiv.remove();
            }, 5000);
            
            // Scroll to success message
            successDiv.scrollIntoView({ behavior: 'smooth' });
        }

        // Close modal
        function closeModal() {
            document.getElementById('confirmModal').style.display = 'none';
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('confirmModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
